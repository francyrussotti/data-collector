# Analisi sui dati raccolti (foresight). Avvio manuale: Actions → analysis → Run workflow.
# Non chiama OpenAlex: legge i database dalla release "data" e allega i risultati.
name: analysis

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Fase da eseguire (inspect | signals | probe)"
        required: true
        default: inspect

permissions:
  contents: write

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      DATA_TAG: data
      STEP: ${{ inputs.step }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Scarica i database
        if: env.STEP != 'probe'
        run: |
          mkdir -p data analysis/results
          for f in papers.sqlite.gz emerging.sqlite.gz daily.sqlite.gz trends.sqlite.gz trends.json emerging_topics.meta.json; do
            gh release download "$DATA_TAG" --pattern "$f" --dir data || echo "manca $f"
          done
          for f in data/*.gz; do [ -e "$f" ] && gunzip -f "$f"; done
          ls -la data
      - name: Ispezione
        if: env.STEP == 'inspect'
        run: |
          python analysis/inspect_data.py data/papers.sqlite data/emerging.sqlite data/daily.sqlite \
            --trends-db data/trends.sqlite -o analysis/results/01_inspection.json --chunks 3000
      - name: Sonda delle fonti gratuite
        if: env.STEP == 'probe'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python analysis/probe_sources.py
      - name: Segnali
        if: env.STEP == 'signals'
        run: python analysis/signals.py --data data -o analysis/results/02_signals.json --chunks 3000
      - name: Allega i risultati alla release
        if: env.STEP != 'probe'
        run: gh release upload "$DATA_TAG" analysis/results/*.json --clobber
      - name: Salva i risultati nel repository (versionati)
        if: env.STEP != 'probe'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/results/*.json
          if git diff --cached --quiet; then echo "nessuna modifica"; exit 0; fi
          git commit -m "analysis: risultati fase $STEP ($(date -u +%F))"
          git pull --rebase origin main
          git push origin HEAD:main
